name: Translate documentation

on:
  push:
    paths:
      - "doc/**"
      - "scripts/translate_docs.py"
      - ".github/workflows/translate-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Translate changed documentation
        env:
          INDEX_TRANSLATE_MODEL: Index-Translate-35B-A3B
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/translate_docs.py \
              --base-ref "$EVENT_BEFORE" \
              --head-ref "$GITHUB_SHA"
          else
            python scripts/translate_docs.py
          fi

      - name: Commit translated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc-en
          if git diff --cached --quiet; then
            echo "No translated documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: update English translations"
          git push